services:
  sabnzbd-movies:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd-movies
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
    volumes:
      - /var/config/sabnzbd-movies:/config
      - /mnt/nas1/mattyflix:/mattyflix
    networks:
      - proxy
    ports:
      - 8080:8080
    restart: unless-stopped

  sabnzbd-series:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd-series
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
    volumes:
      - /var/config/sabnzbd-series:/config
      - /mnt/nas2/mattyflix:/mattyflix
    networks:
      - proxy
    ports:
      - 8081:8080
    restart: unless-stopped

  sabnzbd-music:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd-music
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
    volumes:
      - /var/config/sabnzbd-music:/config
      - /mnt/nas3/mattyflix:/mattyflix
    networks:
      - proxy
    ports:
      - 8082:8080
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
    volumes:
      - /var/config/sonarr:/config
      - /mnt/nas2/mattyflix:/mattyflix
    networks:
      - proxy
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
    volumes:
      - /var/config/radarr:/config
      - /mnt/nas1/mattyflix:/mattyflix
    networks:
      - proxy
    ports:
      - 7878:7878
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
    volumes:
      - /var/config/lidarr:/config
      - /mnt/nas3/mattyflix:/mattyflix
    ports:
      - 8686:8686
    networks:
      - proxy
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
      - AUTO_UPDATE=true #optional
      - RUN_OPTS= #optional
    volumes:
      - /var/config/jackett:/config
    networks:
      - proxy
    ports:
      - 9117:9117
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Detroit
    ports:
      - 5055:5055
    volumes:
      - /var/config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.routers.seerr.rule=Host(`search.mattyflix.com`)"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
  
  tautulli:
    image: ghcr.io/tautulli/tautulli
    container_name: tautulli
    restart: unless-stopped
    volumes:
      - /var/config/Tautulli/config:/config
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
    networks:
      - proxy
    ports:
      - 8181:8181
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.entrypoints=websecure"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.mattyflix.com`)"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
    volumes:
      - /var/config/prowlarr:/config
    networks:
      - proxy
    ports:
      - 9696:9696
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
    volumes:
      - /var/config/bazarr/config:/config
      - /mnt/nas1/mattyflix/media/movies:/movies #optional
      - /mnt/nas2/mattyflix/media/series:/tv #optional
    networks:
      - proxy
    ports:
      - 6767:6767
    restart: unless-stopped
  kometa:
    image: lscr.io/linuxserver/kometa:latest
    container_name: kometa
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Detroit
      - KOMETA_CONFIG=/config/config.yml #optional
      - KOMETA_TIMES=03:00 #optional
      - KOMETA_RUN=False #optional
      - KOMETA_TESTS=False #optional
      - KOMETA_NO_MISSING=False #optional
    networks:
      - proxy
    volumes:
      - /var/config/kometa/config:/config
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    user: 1000:999
    networks:
      - proxy
    volumes:
      - /var/config/maintainerr:/opt/data
    environment:
      - TZ=America/Detroit
      - GITHUB_TOKEN=${GITHUB_PAT}
    ports:
      - 6246:6246
    restart: unless-stopped

  tracearr:
    image: ghcr.io/connorgallopo/tracearr:latest
    container_name: tracearr
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=America/Detroit
      - DATABASE_URL=postgres://tracearr:${TRACEARR_DB_PASSWORD}@tracearr-db:5432/tracearr
      - REDIS_URL=redis://tracearr-redis:6379
      - JWT_SECRET=${TRACEARR_JWT_SECRET}
      - COOKIE_SECRET=${TRACEARR_COOKIE_SECRET}
      - CORS_ORIGIN=${TRACEARR_CORS_ORIGIN:-*}
      - LOG_LEVEL=info
    depends_on:
      tracearr-db:
        condition: service_healthy
      tracearr-redis:
        condition: service_healthy
    volumes:
      - /var/config/tracearr/backups:/data/backup
      # Poster cache (IMAGE_CACHE_DIR); without this every container recreate re-downloads all posters
      - /var/config/tracearr/image-cache:/data/tracearr/image-cache
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracearr.entrypoints=websecure"
      - "traefik.http.routers.tracearr.rule=Host(`stats.mattyflix.com`)"
      - "traefik.http.services.tracearr.loadbalancer.server.port=3000"
    restart: unless-stopped

  tracearr-db:
    image: timescale/timescaledb-ha:pg18.1-ts2.25.0
    container_name: tracearr-db
    shm_size: 512mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: postgres -c timescaledb.license=timescale -c timescaledb.max_tuples_decompressed_per_dml_transaction=0 -c max_locks_per_transaction=4096 -c timescaledb.telemetry_level=off
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=${TRACEARR_DB_PASSWORD}
      - POSTGRES_DB=tracearr
    volumes:
      - /var/config/tracearr/timescale:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracearr"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - proxy
    restart: unless-stopped

  tracearr-redis:
    image: redis:8-alpine
    container_name: tracearr-redis
    command: redis-server --appendonly yes
    volumes:
      - /var/config/tracearr/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy
    restart: unless-stopped

  discord-role-sync:
    # Gives the Discord "Member" role to everyone with Plex access and removes it
    # when access ends (e.g. Wizarr expiry). See discord-role-sync/README.md.
    build: ./discord-role-sync
    image: mattyflix/discord-role-sync:local
    container_name: discord-role-sync
    environment:
      - TZ=America/Detroit
      - DISCORD_TOKEN=${ROLE_SYNC_DISCORD_TOKEN}
      - GUILD_ID=1083290111233503302
      - ROLE_ID=1174435703615135858
      - PLEX_TOKEN=${ROLE_SYNC_PLEX_TOKEN}
      - PLEX_MACHINE_ID=c0b30eb3ffb598b8bb19248f017e0cd07cba6439
      - SEERR_URL=http://seerr:5055
      - SEERR_API_KEY=${ROLE_SYNC_SEERR_API_KEY}
      - DRY_RUN=${ROLE_SYNC_DRY_RUN:-true}
      - MAX_REMOVALS_PER_RUN=${ROLE_SYNC_MAX_REMOVALS:-5}
      - PROTECTED_DISCORD_IDS=${ROLE_SYNC_PROTECTED_IDS:-}
    volumes:
      - /var/config/discord-role-sync:/config:ro
    depends_on:
      - seerr
    networks:
      - proxy
    restart: unless-stopped

  wizarr:
    # Plex invite and onboarding portal
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    environment:
      - PUID=1000
      - PGID=999
      - DISABLE_BUILTIN_AUTH=false
      - TZ=America/Detroit
    ports:
      - 5690:5690
    volumes:
      - /var/config/wizarr/database:/data/database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wizarr.entrypoints=websecure"
      - "traefik.http.routers.wizarr.rule=Host(`join.mattyflix.com`)"
      - "traefik.http.services.wizarr.loadbalancer.server.port=5690"
    networks:
      - proxy
    restart: unless-stopped

  plex-rewind:
    # "Plex Wrapped"-style stats site, reads from Tautulli
    image: ghcr.io/raunot/plex-rewind:latest
    container_name: plex-rewind
    environment:
      - NEXTAUTH_SECRET=${PLEX_REWIND_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://rewind.mattyflix.com
      - NEXT_PUBLIC_SITE_URL=https://rewind.mattyflix.com
    ports:
      - 8383:8383
    volumes:
      - /var/config/plex-rewind:/app/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rewind.entrypoints=websecure"
      - "traefik.http.routers.rewind.rule=Host(`rewind.mattyflix.com`)"
      - "traefik.http.services.rewind.loadbalancer.server.port=8383"
    networks:
      - proxy
    restart: unless-stopped

  tauticord:
    # Discord sidebar stats (streams, bandwidth, library counts) from Tautulli
    image: nwithan8/tauticord:latest
    container_name: tauticord
    hostname: tauticord
    environment:
      TZ: America/Detroit
      TC_DISCORD_BOT_TOKEN: ${TAUTICORD_DISCORD_TOKEN}
      TC_DISCORD_SERVER_ID: 1083290111233503302
      TC_DISCORD_ADMIN_IDS: 875066225309405265
      TC_TAUTULLI_KEY: ${TAUTICORD_TAUTULLI_KEY}
      TC_TAUTULLI_URL: http://tautulli:8181
      TC_USE_SELF_SIGNED_CERT: "False"
      TC_REFRESH_SECONDS: 15
      TC_TERMINATE_MESSAGE: "Your stream has ended."
      TC_SERVER_NAME: "Mattyflix"
      TC_USE_24_HOUR_TIME: "False"
      TC_HIDE_USERNAMES: "True"
      TC_HIDE_PLATFORMS: "True"
      TC_HIDE_PLAYER_NAMES: "True"
      TC_HIDE_QUALITY: "False"
      TC_HIDE_BANDWIDTH: "False"
      TC_HIDE_TRANSCODE: "False"
      TC_HIDE_PROGRESS: "False"
      TC_HIDE_ETA: "False"
      TC_USE_FRIENDLY_NAMES: "True"
      TC_THOUSANDS_SEPARATOR: ","
      TC_VC_STATS_CATEGORY_NAME: "Server Stats"
      TC_VC_STREAM_COUNT: "True"
      TC_VC_STREAM_COUNT_CHANNEL_ID: 0
      TC_VC_TRANSCODE_COUNT: "True"
      TC_VC_TRANSCODE_COUNT_CHANNEL_ID: 0
      TC_VC_BANDWIDTH: "True"
      TC_VC_BANDWIDTH_CHANNEL_ID: 0
      TC_VC_LOCAL_BANDWIDTH: "False"
      TC_VC_LOCAL_BANDWIDTH_CHANNEL_ID: 0
      TC_VC_REMOTE_BANDWIDTH: "False"
      TC_VC_REMOTE_BANDWIDTH_CHANNEL_ID: 0
      TC_VC_PLEX_STATUS: "True"
      TC_VC_PLEX_STATUS_CHANNEL_ID: 0
      TC_VC_LIBRARIES_CATEGORY_NAME: "Library Stats"
      TC_VC_LIBRARY_STATS: "True"
      TC_VC_LIBRARY_NAMES: Movies,TV Shows,Anime - Movies,Anime - TV
      TC_VC_LIBRARY_REFRESH_SECONDS: 3600
      TC_VC_LIBRARY_USE_EMOJIS: "True"
      TC_VC_TV_SERIES_COUNT: "True"
      TC_VC_TV_EPISODE_COUNT: "True"
      TC_DISCORD_POST_SUMMARY_MESSAGE: "True"
      TC_DISCORD_CHANNEL_NAME: "stream-status"
      TC_DISCORD_NITRO: "False"
      TC_ALLOW_ANALYTICS: "True"
      TC_VC_PERFORMANCE_CATEGORY_NAME: "Server Performance"
      TC_MONITOR_CPU: "False"
      TC_MONITOR_MEMORY: "False"
    volumes:
      - /var/config/tauticord:/config
      - /var/logs/tauticord:/logs
    depends_on:
      - tautulli
    networks:
      - proxy
    restart: unless-stopped

  assets:
    # Static files (logos for newsletters, Wizarr, etc.) at https://assets.mattyflix.com/<file>
    # Drop files into /var/config/assets on the host; no restart needed.
    image: nginx:stable-alpine
    container_name: assets
    volumes:
      - /var/config/assets:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.assets.entrypoints=websecure"
      - "traefik.http.routers.assets.rule=Host(`assets.mattyflix.com`)"
      - "traefik.http.services.assets.loadbalancer.server.port=80"
    networks:
      - proxy
    restart: unless-stopped

  cloudflare-ddns:
    # Keeps mail.mattyflix.com pointed at the home IP. Every other subdomain is a
    # CNAME/wildcard to mail.mattyflix.com, so this is the only record that tracks the IP.
    image: favonia/cloudflare-ddns:1
    container_name: cloudflare-ddns
    user: "1000:999"
    read_only: true
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    environment:
      - CF_API_TOKEN=${DDNS_CLOUDFLARE_TOKEN}
      - DOMAINS=mail.mattyflix.com
      - PROXIED=false
      - IP6_PROVIDER=none
      - UPDATE_CRON=@every 5m
      - TZ=America/Detroit
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
